plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.dnsclear'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.dnsclear"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'io.github.iamr0s:Dhizuku-API:2.5.2'
}
